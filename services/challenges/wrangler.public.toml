# Public lab: SEO page at /, Cloudflare challenge on /check.
name = "anti-trace-lab"
main = "src/public.mjs"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "fingerprint-test.ipub.io/*", zone_name = "ipub.io" }
]

[vars]
LAB_ORIGIN = "https://fingerprint-test.ipub.io"

[[durable_objects.bindings]]
name = "ATTEMPTS"
class_name = "AttemptObject"

[[migrations]]
tag = "attempts-v1"
new_sqlite_classes = ["AttemptObject"]
