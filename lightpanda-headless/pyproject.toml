[project]
name = "lightpanda-headless"
version = "0.1.0"
description = "Standalone local Lightpanda session service for pixel-based desktop clients"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["anti-trace==0.2.0"]

[project.scripts]
lightpanda-headless = "lightpanda_headless.__main__:main"

[tool.uv.sources]
anti-trace = { path = "../cli", editable = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lightpanda_headless*"]

[tool.setuptools.package-data]
lightpanda_headless = ["frame_atomic.c"]
