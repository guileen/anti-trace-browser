[project]
name = "anti-trace"
version = "0.2.0"
description = "Anti-tracking, anti-censorship multi-environment manager with AI headless automation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
keywords = ["fingerprint", "privacy", "browser-automation", "camoufox", "playwright"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
  "camoufox==0.5.9",
  "playwright==1.62.0",
  "psutil==7.2.2",
  "pysocks==1.7.1",
  "mioa-core==0.1.0",
]

[project.scripts]
anti-trace = "anti_trace.cli:main"

[tool.uv]
package = true

[tool.uv.sources]
mioa-core = { git = "https://github.com/guileen/mioa-core.git", rev = "fff9c4f3121b5989bf8c5d87ee1f1870be56728c", subdirectory = "mioa-core" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
anti_trace = ["public/*.html", "public/*.css", "public/*.js"]
