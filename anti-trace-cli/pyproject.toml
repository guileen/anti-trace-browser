[project]
name = "anti-trace"
version = "0.2.0"
description = "Anti-tracking, anti-censorship multi-environment manager with AI headless automation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "camoufox==0.5.9",
  "playwright==1.62.0",
  "psutil==7.2.2",
  "pysocks==1.7.1",
]

[project.scripts]
anti-trace = "anti_trace.cli:main"

[tool.uv]
package = true
